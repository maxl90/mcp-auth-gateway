# Edge reverse proxy for the on-prem mcp-auth-gateway (ADR 008, spec §4).
# DMZ-facing: TLS 1.3 termination + client-cert mTLS at the edge, then a
# second mTLS hop to the gateway. Nothing without a valid client cert ever
# reaches the gateway (trust boundary #1); the gateway independently enforces
# Entra OAuth + DPoP (trust boundary #2).

worker_processes auto;
events { worker_connections 1024; }

http {
    # Rate-limit keyed on the client cert serial — one misbehaving agent can't
    # exhaust the edge for everyone (spec §9).
    limit_req_zone $ssl_client_serial zone=mcp:10m rate=10r/s;

    # Map the mTLS verify result to a header the gateway can log/inspect.
    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;

        # --- Public server TLS (client pins the CA, not this leaf) ---
        ssl_certificate     /etc/nginx/certs/edge-public.pem;
        ssl_certificate_key /etc/nginx/certs/edge-public-key.pem;
        ssl_protocols       TLSv1.3;
        ssl_prefer_server_ciphers off;

        # --- Mutual TLS: hard-fail anything without a client cert from our CA ---
        ssl_client_certificate /etc/nginx/certs/client-ca.pem;
        ssl_verify_client on;
        ssl_verify_depth 2;

        # Revocation: certs pulled into the CRL (revoke-cert.sh) are rejected
        # at the handshake. nginx loads this at config time — reload after a
        # revocation (`nginx -s reload`). One of the two independent kill
        # switches (the other: revoking the Entra app grant).
        ssl_crl /etc/nginx/certs/client-ca.crl;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;

        location / {
            limit_req zone=mcp burst=20 nodelay;

            # Two-factor audit trail: forward the client cert identity so the
            # gateway records it alongside the DPoP thumbprint (spec §6).
            proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
            proxy_set_header X-Client-Cert-DN     $ssl_client_s_dn;
            proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto    https;
            proxy_set_header Host                 $host;

            # MCP streams (SSE) — don't buffer, keep the connection open.
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # --- Inner mTLS hop to the gateway ---
            proxy_pass https://gateway:8443;
            proxy_ssl_certificate         /etc/nginx/certs/proxy-client.pem;
            proxy_ssl_certificate_key     /etc/nginx/certs/proxy-client-key.pem;
            proxy_ssl_trusted_certificate /etc/nginx/certs/internal-ca.pem;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_name gateway;
        }
    }
}
