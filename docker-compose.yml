# Governed demo stack: the gateway in front of a Postgres MCP server and a seeded
# Postgres, on one private network. The gateway enforces; the upstream is unrestricted.
#   docker compose up -d --build
# Needs .env.generated and policy.generated.yaml, written by infra/provision-entra.ps1
# against a dev Entra tenant. Without a tenant, use docker-compose.quickstart.yml.

name: mcp-auth-gateway-demo

services:
  gateway:
    build: .                     # the gateway product image (root Dockerfile)
    # Entra auth config (GATEWAY_ISSUER / _AUDIENCE / _JWKS_URL) comes from
    # .env.generated, emitted by infra/provision-entra.ps1. UPSTREAM_MCP_URL in
    # `environment` below overrides the localhost value in that file — inside the
    # container the upstream is reached by compose service DNS, not localhost.
    env_file:
      - .env.generated
    environment:
      UPSTREAM_MCP_URL: http://mcp-upstream:9000/mcp   # service-name DNS on the compose network
      POLICY_PATH: /app/policy.generated.yaml
    volumes:
      - ./policy.generated.yaml:/app/policy.generated.yaml:ro   # group->tool RBAC map (gitignored)
    ports:
      - "8080:8080"
    depends_on:
      - mcp-upstream

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: clinic
    ports:
      # Loopback-only: local psql inspection still works, but the demo DB (with
      # demo/demo creds) is never reachable from other machines on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - ./deploy/db/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d clinic"]
      interval: 3s
      timeout: 3s
      retries: 20

  mcp-upstream:
    build: ./deploy/upstreams/postgres
    environment:
      DATABASE_URI: postgresql://demo:demo@db:5432/clinic
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy
