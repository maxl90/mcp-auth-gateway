# Zero-config quickstart: gateway + sample MCP upstream + seeded Postgres, with
# AUTH_ENABLED=false so it runs from a clean checkout with no Entra tenant.
#   docker compose -f docker-compose.quickstart.yml up --build
# Then POST a JSON-RPC tools/list to http://localhost:8080/mcp (see README).
# Pass-through only: nothing is authenticated. The governed stack is docker-compose.yml.

name: mcp-auth-gateway-quickstart

services:
  gateway:
    build: .
    environment:
      AUTH_ENABLED: "false"                              # <-- no identity in this mode
      UPSTREAM_MCP_URL: http://mcp-upstream:9000/mcp     # compose-DNS to the upstream
    ports:
      - "8080:8080"
    depends_on:
      - mcp-upstream

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: clinic
    volumes:
      - ./deploy/db/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d clinic"]
      interval: 3s
      timeout: 3s
      retries: 20

  mcp-upstream:
    build: ./deploy/upstreams/postgres
    environment:
      DATABASE_URI: postgresql://demo:demo@db:5432/clinic
    depends_on:
      db:
        condition: service_healthy
