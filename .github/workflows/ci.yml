name: CI

# Lint, test under a coverage floor, and build the image on every push to master
# and every pull request. No live Entra tenant is needed: tokens come from an
# in-process RSA key and upstreams are respx mocks (see tests/conftest.py).

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Lock file is current
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Tests with coverage floor
        run: uv run pytest -q --cov=mcp_auth_gateway --cov-fail-under=95

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build the gateway image
        run: docker build -t gateway-ci .
      # The image must run the dependency versions the tests ran: every package the
      # lock pins for linux installed at that version, and nothing the lock lacks.
      - name: Image installs exactly the lock
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o lock.txt
          docker run --rm -v "$PWD/lock.txt:/tmp/lock.txt:ro" --entrypoint sh gateway-ci -ec '
            pip install --dry-run --no-index --no-deps --require-hashes --quiet -r /tmp/lock.txt
            pip check
            extra=$(pip list --format=freeze --exclude pip --exclude mcp-auth-gateway \
              | cut -d= -f1 | tr "A-Z_." "a-z--" \
              | while read -r n; do grep -q "^$n==" /tmp/lock.txt || echo "$n"; done)
            test -z "$extra" || { echo "installed but not in uv.lock: $extra"; exit 1; }'
