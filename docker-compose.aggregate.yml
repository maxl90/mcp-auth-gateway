# Phase 3 demo variant — BOTH upstreams live behind one gateway (aggregation).
#
# The gateway becomes a single virtual MCP server: one /mcp endpoint, one
# merged tool catalog (namespaced postgres__* / github__*), one RBAC pass, one
# audit stream — each call routed to the owning upstream. The trust boundary is
# unchanged: the user's Entra token terminates at the gateway; Postgres and
# GitHub are each reached with that container's own service identity.
#
# This overlay stacks on the base file AND the GitHub overlay (base brings
# gateway+postgres, github brings the second upstream, this one flips the
# gateway into aggregation mode):
#
#   docker compose -f docker-compose.yml -f docker-compose.github.yml \
#                  -f docker-compose.aggregate.yml up -d --build
#
# PREREQUISITES: GITHUB_PERSONAL_ACCESS_TOKEN in .env (see .env.example) and
# policy.aggregate.generated.yaml created from policy.aggregate.example.yaml
# with your real Entra group object ids.

services:
  gateway:
    environment:
      # Aggregation mode: the upstream set comes from upstreams.yaml, not
      # UPSTREAM_MCP_URL (which the github overlay set — override it back so a
      # stray read of it can't point anywhere surprising).
      UPSTREAMS_CONFIG_PATH: /app/upstreams.yaml
      UPSTREAM_MCP_URL: ""
      POLICY_PATH: /app/policy.aggregate.generated.yaml
    volumes:
      - ./upstreams.example.yaml:/app/upstreams.yaml:ro
      - ./policy.aggregate.generated.yaml:/app/policy.aggregate.generated.yaml:ro
    depends_on:
      - mcp-upstream
      - github-upstream
