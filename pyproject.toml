[project]
name = "mcp-auth-gateway"
version = "0.1.0"
description = "Open-source reverse proxy that puts enterprise identity in front of your MCP servers, without your data leaving the network."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "AIIG" }]
keywords = ["mcp", "oauth", "entra", "rbac", "reverse-proxy", "gateway", "governance"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "sqlglot>=30.12.0",
    "jsonschema>=4.21",
]

[project.scripts]
mcp-auth-gateway = "mcp_auth_gateway.main:run"
mcp-auth-gateway-verify-audit = "mcp_auth_gateway.audit.verify:main"
mcp-auth-gateway-export-audit = "mcp_auth_gateway.audit.export:main"
mcp-auth-gateway-evidence-report = "mcp_auth_gateway.evidence.report:main"
mcp-auth-gateway-attestation-pack = "mcp_auth_gateway.evidence.attestation:main"

[project.optional-dependencies]
demo = [
    "msal>=1.31",
    "msal-extensions>=1.2",
    "mcp>=1.2",
    "anyio>=4.0",
]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_auth_gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests and demo/utility scripts favor readability of inline JSON-RPC payloads
# over the 100-col limit, and use nested `with` for MCP client context managers.
"tests/**" = ["E501"]
"demo/**" = ["E501", "SIM117"]
"scripts/**" = ["E501", "SIM117"]
# Single-file stdlib viewer: aligned config tables + inline CSS/JS favor long lines.
"viewer.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
