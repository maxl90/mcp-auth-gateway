[project]
name = "mcp-auth-gateway"
version = "0.3.0"
description = "Open-source reverse proxy that puts enterprise identity in front of your MCP servers, without your data leaving the network."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jeff Pilosi" }]
keywords = ["mcp", "oauth", "entra", "rbac", "reverse-proxy", "gateway", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.14",
    "cryptography>=42",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "sqlglot>=30.12.0",
    "jsonschema>=4.21",
]

[project.urls]
Homepage = "https://github.com/maxl90/mcp-auth-gateway"
Repository = "https://github.com/maxl90/mcp-auth-gateway"
Changelog = "https://github.com/maxl90/mcp-auth-gateway/blob/master/CHANGELOG.md"
Issues = "https://github.com/maxl90/mcp-auth-gateway/issues"

[project.scripts]
mcp-auth-gateway = "mcp_auth_gateway.main:run"
mcp-auth-gateway-verify-audit = "mcp_auth_gateway.audit.verify:main"
mcp-auth-gateway-export-audit = "mcp_auth_gateway.audit.export:main"
mcp-auth-gateway-evidence-report = "mcp_auth_gateway.evidence.report:main"
mcp-auth-gateway-attestation-pack = "mcp_auth_gateway.evidence.attestation:main"

[project.optional-dependencies]
demo = [
    "msal>=1.31",
    "msal-extensions>=1.2",
    "mcp>=1.2",
    "anyio>=4.0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.14",
    "mypy>=2.4",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_auth_gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests and demo/utility scripts favor readability of inline JSON-RPC payloads
# over the 100-col limit, and use nested `with` for MCP client context managers.
"tests/**" = ["E501"]
"demo/**" = ["E501", "SIM117"]
"scripts/**" = ["E501", "SIM117"]
# Single-file stdlib viewer: aligned config tables + inline CSS/JS favor long lines.
"tools/config_viewer.py" = ["E501"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
